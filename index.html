<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>قراراتك تصنع قصتك | اليوم العالمي للصحة النفسية</title>
    <!-- خطوط Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1F2E5E;        /* الكحلي الرسمي لهوية نادي المؤسس */
            --primary-light: #2C4182;
            --teal: #2A7F62;           /* لون الصحة النفسية المتناغم */
            --bg-color: #F8F9FC;
            --card-bg: #FFFFFF;
            --card-border: #E2E8F0;
            --text-main: #1A202C;
            --text-muted: #4A5568;
            --accent: #8E7CC3;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(31, 46, 94, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .event-badge {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 700;
            background: #EDF2F7;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        main {
            max-width: 700px;
            width: 100%;
            margin: 20px auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 35px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 800;
            line-height: 1.3;
        }

        h2 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .disclaimer-box {
            background: #F7FAFC;
            border-right: 4px solid var(--teal);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(31, 46, 94, 0.2);
        }

        .btn:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #EDF2F7;
        }

        .paths-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
        }

        .path-card {
            background: #FAFCFF;
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .path-card:hover {
            border-color: var(--primary);
            background: #EDF2F7;
            transform: translateY(-2px);
        }

        .path-info h3 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .path-info p {
            font-size: 0.9rem;
            margin-bottom: 0;
            color: var(--text-muted);
        }

        .path-icon {
            font-size: 2rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #FAFCFF;
            border: 1.5px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 12px;
            text-align: right;
            font-size: 1.05rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .option-btn:hover {
            border-color: var(--teal);
            background: #EDF2F7;
        }

        .feedback-box {
            background: #EDF2F7;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            animation: fadeIn 0.3s ease;
        }

        .feedback-box h4 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .feedback-box p {
            color: var(--text-main);
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .progress-container {
            width: 100%;
            background-color: var(--card-border);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--teal);
            width: 0%;
            transition: width 0.3s ease;
        }

        .result-section {
            margin-bottom: 20px;
        }

        .result-section h3 {
            color: var(--teal);
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .result-section ul {
            padding-right: 20px;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .result-section li {
            margin-bottom: 6px;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 10px 0;
            border-top: 1px solid var(--card-border);
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            h1 { font-size: 1.8rem; }
            .logo-img { height: 38px; }
            .event-badge { font-size: 0.8rem; padding: 4px 10px; }
        }
    </style>
</head>

                        desc: "تجد نفسك أمام عدة خيارات مهنية أو شخصية مهمة، وكل خيار يحمل إيجابيات وسلبيات.",
                        options: [
                            { text: "أؤجل القرار لفترات طويلة هربًا من خطأ الاختيار.", feedback: "تظل عالقًا في نفس النقطة بينما الوقت يمضي.", category: "stress" },
                            { text: "أكتب المعايير الأساسية، وأستشير شخصًا ثقة، ثم أتخذ قرارًا وأتقبله.", feedback: "تمنح نفسك طمأنينة الوضوح وتخطو بثبات.", category: "support" },
                            { text: "أترك الاختيار للصدفة أو للآخرين لكي لا أتحمل المسؤولية.", feedback: "تفقد السيطرة على مسار خياراتك.", category: "boundaries" }
                        ]
                    }
                ],
                result: {
                    summary: "تتعامل مع المتغيرات والمفاجآت بدرجة جيدة من المرونة والقدرة على إعادة توجيه بوصلتك.",
                    strengths: ["المرونة الفكرية وسرعة التأقلم", "الانفتاح على التعلم المستمر من التجارب"],
                    reflection: ["في لحظات عدم اليقين العالية، قد تحتاج لمنح نفسك وقتاً قصيراً لالتقاط الأنفاس قبل اتخاذ القرار."],
                    action: "احتفظ دائمًا بقائمة صغيرة للخطط البديلة (Plan B) لتخفيف حدة المفاجآت المستقبلية."
                }
            }
        };

        let currentState = {
            view: 'home',
            currentPath: null,
            currentScenarioIndex: 0,
            answers: []
        };

        const appContainer = document.getElementById('app-container');

        function render() {
            appContainer.innerHTML = '';
            
            if (currentState.view === 'home') {
                renderHome();
            } else if (currentState.view === 'path_select') {
                renderPathSelect();
            } else if (currentState.view === 'quiz') {
                renderQuiz();
            } else if (currentState.view === 'result') {
                renderResult();
            }
        }

        function renderHome() {
            appContainer.innerHTML = `
                <div class="card">
                    <h1>قراراتك تصنع قصتك</h1>
                    <p>تجربة تفاعلية هادئة مستلهمة من أساليب التعامل مع المواقف والضغوط اليومية، تساعدك على اكتشاف أنماط استجابتك وتطوير وعيك الذاتي.</p>
                    
                    <div class="disclaimer-box">
                        <strong>تنويه توعوي وعلمي:</strong> هذه التجربة توعوية وانعكاسية بحتة وليست أداة تشخيص أو تقييم سريري، ولا تغني عن استشارة المختص عند الحاجة.
                    </div>

                    <button class="btn" onclick="goToPathSelect()">ابدأ التجربة الان ←</button>
                </div>
            `;
        }

        function goToPathSelect() {
            currentState.view = 'path_select';
            render();
        }

        function renderPathSelect() {
            let html = `
                <div class="card">
                    <h2>اختر مسار الرحلة</h2>
                    <p>اختر أحد السيناريوهات التالية لتخوض تجربتك الانعكاسية:</p>
                    <div class="paths-grid">
            `;

            for (let key in pathsData) {
                html += `
                    <div class="path-card" onclick="startPath('${key}')">
                        <div class="path-info">
                            <h3>${pathsData[key].title}</h3>
                            <p>${pathsData[key].desc}</p>
                        </div>
                        <div class="path-icon">${pathsData[key].icon}</div>
                    </div>
                `;
            }

            html += `
                    </div>
                    <button class="btn btn-secondary" onclick="goToHome()">العودة للرئيسية</button>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function goToHome() {
            currentState.view = 'home';
            render();
        }

        function startPath(pathKey) {
            currentState.currentPath = pathKey;
            currentState.currentScenarioIndex = 0;
            currentState.answers = [];
            currentState.view = 'quiz';
            render();
        }

        function renderQuiz() {
            const path = pathsData[currentState.currentPath];
            const scenario = path.scenarios[currentState.currentScenarioIndex];
            const total = path.scenarios.length;
            const progress = ((currentState.currentScenarioIndex) / total) * 100;

            let html = `
                <div class="card">
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--teal); font-weight: 700; margin-bottom: 8px;">
                        ${path.title} — الموقف ${currentState.currentScenarioIndex + 1} من ${total}
                    </div>
                    <h2>${scenario.title}</h2>
                    <p>${scenario.desc}</p>
                    
                    <div class="options-list" id="options-list">
            `;

            scenario.options.forEach((opt, idx) => {
                html += `<button class="option-btn" onclick="selectOption(${idx})">${opt.text}</button>`;
            });

            html += `
                    </div>
                    <div id="feedback-container"></div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function selectOption(optionIndex) {
            const path = pathsData[currentState.currentPath];
            const scenario = path.scenarios[currentState.currentScenarioIndex];
            const chosenOpt = scenario.options[optionIndex];

            currentState.answers.push(chosenOpt);

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(btn => btn.disabled = true);

            const feedbackContainer = document.getElementById('feedback-container');
            feedbackContainer.innerHTML = `
                <div class="feedback-box">
                    <h4>أثر الاختيار على القصة:</h4>
                    <p>${chosenOpt.feedback}</p>
                    <button class="btn" onclick="nextScenario()">المتابعة إلى الموقف التالي ←</button>
                </div>
            `;
        }

        nextScenario = function() {
            const path = pathsData[currentState.currentPath];
            currentState.currentScenarioIndex++;

            if (currentState.currentScenarioIndex < path.scenarios.length) {
                renderQuiz();
            } else {
                currentState.view = 'result';
                render();
            }
        }

        function renderResult() {
            const path = pathsData[currentState.currentPath];
            const res = path.result;

            appContainer.innerHTML = `
                <div class="card">
                    <h2>نتيجة مسارك: ${path.title} 🎯</h2>
                    <p style="font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin-bottom: 20px;">
                        ${res.summary}
                    </p>

                    <div class="result-section">
                        <h3>💡 نقاط القوة الملاحظة:</h3>
                        <ul>
                            ${res.strengths.map(s => `<li>${s}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="result-section" style="margin-top: 15px;">
                        ### 🌱 مساحة للتأمل والتطوير:
                        <ul>
                            ${res.reflection.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="result-section" style="margin-top: 15px;">
                        <h3>🛠️ اقتراح عملي صغير:</h3>
                        <p style="background: #F7FAFC; padding: 12px; border-radius: 8px; font-size: 0.95rem; color: var(--text-main); margin-bottom: 20px;">
                            ${res.action}
                        </p>
                    </div>

                    <div class="disclaimer-box">
                        <strong>تنويه:</strong> هذه النتيجة انعكاسية توعوية وليست تشخيصًا أو تقييمًا سريريًا.
                    </div>

                    <div style="display: flex; gap: 10px; flex-direction: column;">
                        <button class="btn" onclick="goToPathSelect()">جرّب مسارًا آخر 🔄</button>
                        <button class="btn btn-secondary" onclick="goToHome()">العودة للرئيسية 🏠</button>
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
