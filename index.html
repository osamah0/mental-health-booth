<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراراتك تصنع قصتك | اليوم العالمي للصحة النفسية</title>
    <!-- خطوط Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2C6B4F;
            --primary-hover: #22533D;
            --teal: #2A7F62;
            --teal-light: #E8F4F0;
            --bg-color: #F4F7F5;
            --card-bg: #FFFFFF;
            --card-border: #D8E3DD;
            --text-main: #1C2823;
            --text-muted: #4A5D55;
            --radius: 20px;
            --shadow: 0 12px 40px rgba(44, 107, 79, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--card-border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .event-badge {
            font-size: 0.95rem;
            color: var(--primary);
            font-weight: 800;
            background: var(--teal-light);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(42, 127, 98, 0.2);
        }

        main {
            max-width: 850px;
            width: 100%;
            margin: 30px auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.4rem;
            color: var(--primary);
            margin-bottom: 18px;
            font-weight: 900;
            line-height: 1.3;
        }

        h2 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 18px;
            font-weight: 800;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .disclaimer-box {
            background: var(--teal-light);
            border-right: 5px solid var(--primary);
            padding: 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 28px;
            line-height: 1.7;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.15rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-shadow: 0 6px 18px rgba(44, 107, 79, 0.25);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background-color: var(--teal-light);
        }

        .paths-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 25px;
        }

        .path-card {
            background: #FAFCFA;
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 22px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .path-card:hover {
            border-color: var(--primary);
            background: var(--teal-light);
            transform: translateY(-3px);
        }

        .path-info h3 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 6px;
            font-weight: 800;
        }

        .path-info p {
            font-size: 0.95rem;
            margin-bottom: 0;
            color: var(--text-muted);
        }

        .path-icon {
            font-size: 2.2rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 22px;
        }

        .option-btn {
            background: #FAFCFA;
            border: 2px solid var(--card-border);
            padding: 18px 22px;
            border-radius: 14px;
            text-align: right;
            font-size: 1.1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 700;
            line-height: 1.5;
        }

        .option-btn:hover {
            border-color: var(--teal);
            background: var(--teal-light);
        }

        .feedback-box {
            background: var(--teal-light);
            border-radius: 14px;
            padding: 22px;
            margin-top: 22px;
            border: 1px solid rgba(42, 127, 98, 0.2);
            animation: fadeIn 0.3s ease;
        }

        .feedback-box h4 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .feedback-box p {
            color: var(--text-main);
            margin-bottom: 18px;
            font-size: 1.05rem;
        }

        .progress-container {
            width: 100%;
            background-color: var(--card-border);
            height: 10px;
            border-radius: 6px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--teal);
            width: 0%;
            transition: width 0.35s ease;
        }

        .result-section {
            margin-bottom: 22px;
        }

        .result-section h3 {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .result-section ul {
            padding-right: 22px;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .result-section li {
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 15px 0;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
            font-weight: 600;
        }

        @media (max-width: 650px) {
            .card { padding: 25px 20px; }
            h1 { font-size: 1.9rem; }
            header { padding: 12px 15px; }
            .event-badge { font-size: 0.8rem; padding: 6px 12px; }
        }
    </style>
</head>
